<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manutenção de Equipamentos — Rede Nilo</title>
<meta name="theme-color" content="#072772">
<style>
:root{--am:#F9E109;--am-l:#FCFC0A;--navy:#072772;--royal:#0C2E84;--red:#A61309;--vinho:#910702;--ink:#333;--bg:#F7F7F5;--card:#fff;--line:#e3e3dc;--mut:#6b6f7a;--ok:#1E7B4F;--warn:#E6A100;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{color:var(--navy);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--mut)}.sm{font-size:12px}.b{font-weight:600}.right{text-align:right}.hide{display:none!important}
/* header */
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--am);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{background:var(--am);color:var(--navy);font-weight:800;border-radius:8px;padding:4px 10px;letter-spacing:.5px}
header h1{color:#fff;font-size:16px;flex:1;min-width:180px}
header .who{font-size:12px;opacity:.9;text-align:right}
.demo{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:5}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--navy);border-color:var(--am)}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
/* controls */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--am);border-color:var(--am);color:var(--navy)}
.btn.pri:hover{background:var(--warn);border-color:var(--warn)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select,.bar input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
.bar .grow{flex:1}
/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--am);border-radius:var(--r);padding:10px 12px}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.kpi.bad{border-left-color:var(--red)}.kpi.bad .v{color:var(--red)}
.kpi.good{border-left-color:var(--ok)}.kpi.good .v{color:var(--ok)}
.kpi .s{font-size:11px;color:var(--mut)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{background:#ecece6;border-radius:var(--r);min-height:200px;scroll-snap-align:start;display:flex;flex-direction:column}
.col h3{font-size:13px;padding:9px 10px;border-top:4px solid var(--c,#999);border-radius:var(--r) var(--r) 0 0;display:flex;justify-content:space-between;background:#fff}
.col h3 span{background:var(--bg);border-radius:99px;padding:0 8px;font-size:12px}
.col .cards{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:9px 10px;cursor:pointer}
.card:hover{box-shadow:0 2px 8px rgba(7,39,114,.15)}
.card.warn{border-left-color:var(--warn)}.card.late{border-left-color:var(--red)}.card.none{border-left-color:#aab}
.card .t{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.card .n{font-weight:800;color:var(--navy)}
.card .d{font-weight:600;margin:2px 0}
.card .m{font-size:12px;color:var(--mut)}
.chrono{display:flex;gap:8px;margin-top:6px;font-size:12px;align-items:center;flex-wrap:wrap}
.chrono b{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.late{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.stg{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.stg span{font-size:11px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:5px;padding:1px 6px;background:var(--bg);color:var(--mut);white-space:nowrap}
.stg span.cur{background:#fffbd6;border-color:var(--am);border-left-color:var(--c);color:var(--ink)}
.stg b{color:var(--navy);font-variant-numeric:tabular-nums}
.cardacts{display:flex;gap:6px;margin-top:8px}
.cardacts .btn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardacts .btn.pri{flex:1 1 auto}
.cardacts .btn:not(.pri){flex:0 0 auto}
.slabar{height:5px;background:#e6e6df;border-radius:9px;margin-top:5px;overflow:hidden}
.slabar i{display:block;height:100%;background:var(--ok)}.slabar i.warn{background:var(--warn)}.slabar i.late{background:var(--red)}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:#e8eaf3;color:var(--navy);white-space:nowrap}
.tag.alta{background:#f6d9d6;color:var(--red)}.tag.media{background:#fbf0c2;color:#7a5a00}.tag.baixa{background:#dcefe4;color:var(--ok)}
.tag.prev{background:var(--navy);color:#fff}
.tag.flag{background:var(--red);color:#fff}.tag.am{background:var(--am);color:var(--navy)}
/* tables */
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th{background:var(--navy);color:#fff;text-align:left;font-size:12px;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:#fffbd6}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.panel h2{font-size:15px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.cv{position:relative;height:260px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(7,39,114,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:50}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:680px;padding:16px;border-top:5px solid var(--am)}
.mbox.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.mh button{border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #cfd0c8;border-radius:8px;padding:8px}
.fld textarea{min-height:68px}
.fld .rad{display:flex;gap:14px;flex-wrap:wrap}.fld .rad label{font-weight:500;color:var(--ink)}
.fld .rad input{width:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.novotipo{background:#fffbd6;border:1px solid var(--am);border-radius:8px;padding:8px 10px;margin-top:6px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:10px 0}
.facts div{background:var(--bg);border-radius:8px;padding:6px 9px}
.facts small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase}
.timers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.timers div{border:2px solid var(--navy);border-radius:10px;padding:8px 10px;text-align:center}
.timers b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--navy)}
.timers .late{border-color:var(--red)}.timers .late b{color:var(--red)}
.timers .warn{border-color:var(--warn)}
.tl{border-left:3px solid var(--am);margin:8px 0 8px 6px;padding-left:14px}
.tl li{list-style:none;margin-bottom:10px;position:relative}
.tl li:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--navy);border:2px solid #fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.alert{background:#fff4d6;border:1px solid var(--am);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.alert.red{background:#fbe3e0;border-color:var(--red)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;display:none}
#login{max-width:360px;margin:8vh auto;background:#fff;border-radius:14px;padding:22px;border-top:6px solid var(--am);box-shadow:0 6px 24px rgba(7,39,114,.15)}
#login h1{font-size:19px;margin-bottom:4px}
#printArea{display:none}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}main{padding:10px}.board{grid-auto-columns:82%}header .who{text-align:left}}
@media print{
 .noprint,header,nav.tabs,#modal,#toast{display:none!important}
 body{background:#fff}main{padding:0}.panel,.kpi,.tw{break-inside:avoid}
 body.pf main{display:none}body.pf #printArea{display:block}
 #printArea h1{color:var(--navy);border-bottom:4px solid var(--am);padding-bottom:6px}
 #printArea table td{border:1px solid #bbb}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* =========================================================
   CONFIGURAÇÃO — cole aqui a URL /exec do Apps Script.
   Vazia = MODO DEMONSTRAÇÃO (dados no navegador).
   ========================================================= */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbzeSWigHyK4LvuZv9OQE-GWJdAlos3XHKNApU6zNdXJbI-ys_5QFrr63Qw2VULuCY3bdg/exec' };
const SALT = 'nilo-manut';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const H = 3600000, D = 86400000;
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fdt = t => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const fd = t => t ? new Date(t).toLocaleDateString('pt-BR') : '—';
const dayISO = t => new Date(t).toISOString().slice(0, 10);
function fdur(ms, sec) {
  ms = Math.max(0, ms); const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  if (d) return `${d}d ${h}h ${p(m)}m`;
  if (h) return `${h}h ${p(m)}m` + (sec ? ` ${p(ss)}s` : '');
  return `${m}m` + (sec ? ` ${p(ss)}s` : '');
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200); }
async function sha(usuario, senha) {
  const raw = SALT + '|' + String(usuario).toLowerCase() + '|' + senha;
  if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  return btoa(raw);
}
const uid = () => Math.random().toString(16).slice(2, 10);

/* ---------- domínio ---------- */
const ETAPAS = [
  { id: 'aberta', nome: 'Aberta', cor: '#8a93ab' },
  { id: 'diagnostico', nome: 'Diagnóstico', cor: '#0C2E84' },
  { id: 'transito', nome: 'Em trânsito', cor: '#E6A100' },
  { id: 'manutencao', nome: 'Em manutenção', cor: '#072772' },
  { id: 'pecas', nome: 'Aguardando peças', cor: '#A61309' },
  { id: 'concluida', nome: 'Concluída', cor: '#1E7B4F' },
  { id: 'disponivel', nome: 'Disponível p/ retirada', cor: '#3b8f86' },
  { id: 'encerrada', nome: 'Encerrada', cor: '#555' },
  { id: 'cancelada', nome: 'Cancelada', cor: '#999' }
];
const ET = Object.fromEntries(ETAPAS.map(e => [e.id, e]));
const KANBAN = ['aberta', 'diagnostico', 'transito', 'manutencao', 'pecas', 'concluida', 'disponivel'];
const TERMINAL = ['encerrada', 'cancelada'];
const CRIT = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const CFG_DEFAULT = {
  sla: { alta: 4, media: 24, baixa: 72 },
  tipos: [
    { nome: 'Câmara fria / congelamento', crit: 'alta', freq: 30 }, { nome: 'Compressor / refrigeração central', crit: 'alta', freq: 30 },
    { nome: 'Freezer / expositor refrigerado', crit: 'alta', freq: 30 }, { nome: 'Sistema elétrico (quadros)', crit: 'alta', freq: 90 },
    { nome: 'Balança / pesagem', crit: 'media', freq: 180 }, { nome: 'Padaria (forno, batedeira, modeladora)', crit: 'media', freq: 30 },
    { nome: 'Açougue (serra, moedor, fatiadora)', crit: 'media', freq: 30 }, { nome: 'Ar-condicionado (área de vendas)', crit: 'media', freq: 30 },
    { nome: 'Ar-condicionado (escritório/retaguarda)', crit: 'baixa', freq: 30 }, { nome: 'Empilhadeira / transpaleteira', crit: 'baixa', freq: 30 },
    { nome: 'CFTV / alarme / controle de acesso', crit: 'baixa', freq: 180 }, { nome: 'Copa / refeitório', crit: 'baixa', freq: 180 },
    { nome: 'Outro', crit: 'baixa', freq: 180 }]
};

const S = { user: null, token: '', lojas: [], equips: [], forn: [], planos: [], os: [], hist: [], usuarios: [], config: CFG_DEFAULT, view: 'kanban', f: { loja: '', tec: '', man: '', q: '', st: 'abertas' }, hb: {}, charts: [] };
const isM = () => S.user.perfil === 'master', isT = () => S.user.perfil === 'tecnico', isL = () => S.user.perfil === 'loja';
const minhasLojas = () => S.user.lojas === '*' ? S.lojas.map(l => l.id) : String(S.user.lojas || '').split(',').filter(Boolean);
const lojaN = id => (S.lojas.find(l => l.id === id) || {}).nome || '—';
const userN = id => (S.usuarios.find(u => u.id === id) || {}).nome || '—';
const equipOf = id => S.equips.find(e => e.id === id);
const fornN = id => { if (!id) return '—'; if (String(id).startsWith('x:')) return String(id).slice(2) + ' (não homologado)'; const f = S.forn.find(x => x.id === id); return f ? f.nome : '—'; };
const tipoCfg = nome => S.config.tipos.find(t => t.nome === nome) || { crit: 'baixa', freq: 180 };
const sla = c => (S.config.sla || CFG_DEFAULT.sla)[c] || 24;
const abertas = () => S.os.filter(o => !TERMINAL.includes(o.status));

/* ---------- camada de dados (remoto = Apps Script | local = demo) ---------- */
async function api(action, payload = {}) {
  if (!CONFIG.API_URL) return Local.call(action, payload);
  let r, j;
  try { r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...payload }) }); }
  catch (err) { throw new Error('Sem conexão com o servidor. Verifique a internet e se a implantação do Apps Script está com acesso "Qualquer pessoa".'); }
  try { j = JSON.parse(await r.text()); }
  catch (err) { throw new Error('O Apps Script não respondeu como API. Publique a versão mais recente do Code.gs (Implantar > Gerenciar implantações > Nova versão), autorize as permissões e confira o acesso "Qualquer pessoa".'); }
  if (!j.ok) { const e = new Error(j.error || 'Erro'); e.code = j.code; throw e; }
  return j.data;
}
const Local = {
  KEY: 'nilo_manut_demo_v2',
  db() { try { const d = JSON.parse(localStorage.getItem(this.KEY)); if (d) return d; } catch (e) { } const d = seedDemo(); this.save(d); return d; },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { toast('Armazenamento local cheio'); } },
  reset() { try { localStorage.removeItem(this.KEY); } catch (e) { } },
  vis(u, o) { if (u.perfil === 'master') return true; if (u.perfil === 'tecnico') return o.tecnicoId === u.id; const l = u.lojas === '*' ? null : String(u.lojas).split(','); return !l || l.includes(o.lojaOrigem) || l.includes(o.lojaDestino); },
  pub(u, full) { const o = { id: u.id, nome: u.nome, perfil: u.perfil, lojas: u.lojas, ativo: u.ativo }; if (full) { o.usuario = u.usuario; o.email = u.email; o.trocar = u.trocar; o.bloqueioAte = u.bloqueioAte; } return o; },
  async call(action, p) {
    const d = this.db(), find = n => d.usuarios.find(x => x.usuario.toLowerCase() === String(n || '').trim().toLowerCase());
    if (action === 'login') {
      const u = find(p.usuario), agora = Date.now(); if (!u) throw new Error('Usuário ou senha inválidos.');
      if (u.bloqueioAte && new Date(u.bloqueioAte) > agora) throw new Error('Acesso bloqueado por tentativas inválidas. Tente em ' + Math.ceil((new Date(u.bloqueioAte) - agora) / 60000) + ' min ou peça o desbloqueio ao Master.');
      if (u.hash !== p.hash) { u.falhas = (u.falhas || 0) + 1; if (u.falhas >= 5) { u.bloqueioAte = new Date(agora + 15 * 60000).toISOString(); u.falhas = 0; } this.save(d); throw new Error('Usuário ou senha inválidos.'); }
      if (u.ativo === 'pendente') throw new Error('Cadastro aguardando autorização do Master.');
      if (u.ativo !== 'sim') throw new Error('Acesso inativo. Procure o Master.');
      u.falhas = 0; u.bloqueioAte = ''; this.save(d); return { token: 'local:' + u.id, user: this.pub(u, true) };
    }
    if (action === 'register') {
      if (!p.usuario || !p.nome || !p.email || !p.hash) throw new Error('Preencha nome, e-mail, usuário e senha');
      if (find(p.usuario)) throw new Error('Nome de usuário já existe');
      d.usuarios.push({ id: uid(), nome: p.nome, usuario: p.usuario.trim(), email: p.email, hash: p.hash, perfil: 'loja', lojas: '', ativo: 'pendente', criadoEm: new Date().toISOString(), trocar: 'nao', falhas: 0 }); this.save(d); return { ok: true };
    }
    if (action === 'forgot') {
      const u = find(p.usuario); let cod = '';
      if (u && u.ativo === 'sim') { cod = String(Math.floor(100000 + Math.random() * 900000)); u.resetCod = cod; u.resetExp = Date.now() + 30 * 60000; this.save(d); }
      return { enviado: true, codigoDemo: cod };
    }
    if (action === 'resetPassword') {
      const u = find(p.usuario); if (!u || !u.resetCod || u.resetExp < Date.now() || u.resetCod !== String(p.codigo).trim()) throw new Error('Código inválido ou expirado. Solicite um novo.');
      u.hash = p.hash; u.resetCod = ''; u.falhas = 0; u.bloqueioAte = ''; u.trocar = 'nao'; this.save(d); return { ok: true };
    }
    const u = d.usuarios.find(x => 'local:' + x.id === p.token || 'local:' + x.id === S.token);
    if (!u) { const e = new Error('Sessão expirada'); e.code = 'auth'; throw e; }
    if (action === 'bootstrap') {
      const os = d.os.filter(o => this.vis(u, o)), set = new Set(os.map(o => o.numero));
      return { user: this.pub(u, true), lojas: d.lojas, equipamentos: d.equipamentos, fornecedores: d.fornecedores, planos: d.planos, os, hist: d.hist.filter(h => set.has(h.os)), usuarios: d.usuarios.map(x => this.pub(x, u.perfil === 'master')), config: d.config };
    }
    if (action === 'saveOS') {
      const os = p.os, ev = p.evento;
      if (!os.numero) { const y = new Date().getFullYear(); let mx = 0; d.os.forEach(o => { const m = o.numero.match(/^OS-(\d{4})-(\d+)$/); if (m && +m[1] === y) mx = Math.max(mx, +m[2]); }); os.numero = `OS-${y}-${String(mx + 1).padStart(4, '0')}`; os.criadoEm = new Date().toISOString(); os.criadoPor = u.id; }
      os.atualizadoEm = new Date().toISOString();

function tempos(os) {
  const ev = S.hb[os.numero] || [], now = Date.now(), por = {};
  const first = ev.length ? new Date(ev[0].ts).getTime() : new Date(os.criadoEm).getTime();
  ev.forEach((e, i) => {
    const a = new Date(e.ts).getTime(), b = ev[i + 1] ? new Date(ev[i + 1].ts).getTime() : (TERMINAL.includes(os.status) ? a : now);
    if (!TERMINAL.includes(e.para)) por[e.para] = (por[e.para] || 0) + (b - a);
  });
  const fim = TERMINAL.includes(os.status) ? new Date(os.encerradoEm || (ev.length ? ev[ev.length - 1].ts : now)).getTime() : now;
  const conc = ev.find(e => e.para === 'concluida' || e.para === 'encerrada');
  return { por, first, total: fim - first, fim, concTs: conc ? new Date(conc.ts).getTime() : null, inativ: fim - first };
}
function slaInfo(os) {

}

  modal(`<div class="mh"><div><h3>${esc(os.numero)} <span class="tag" style="background:${e.cor};color:#fff">${esc(e.nome)}</span> <span class="tag ${os.criticidade}">${CRIT[os.criticidade] || ''}</span> ${os.tipoMan === 'preventiva' ? '<span class="tag prev">Preventiva</span>' : ''}</h3><div class="muted sm">Aberta em ${fdt(os.criadoEm)} por ${esc(userN(os.criadoPor))}</div></div><button data-act="close">×</button></div>
  <div class="timers">
    <div class="${sl && !sl.closed ? sl.state : ''}"><span class="sm muted">⏱ Tempo total ${TERMINAL.includes(os.status) ? '(final)' : '(parado)'}</span><b ${cls ? `data-since="${t.first}" data-sec="1"` : ''}>${fdur(t.total, true)}</b></div>
    ${!TERMINAL.includes(os.status) ? `<div><span class="sm muted">Etapa atual: ${esc(e.nome)}</span><b data-since="${new Date(os.etapaDesde).getTime()}" data-sec="1">${fdur(Date.now() - new Date(os.etapaDesde))}</b></div>` : ''}
    ${sl ? `<div class="${sl.closed ? '' : sl.state}"><span class="sm muted">SLA ${CRIT[os.criticidade]} (${sla(os.criticidade)}h)</span><b>${sl.closed ? (sl.state === 'ok' ? '✔ cumprido' : '✖ estourado') : (sl.pct >= 1 ? 'Estourado +' + fdur(sl.el - sl.lim) : 'Resta ' + fdur(sl.lim - sl.el))}</b></div>` : ''}

  <div><small>Atendimento</small>${os.atendimento === 'local' ? 'Na própria loja' : os.atendimento === 'transferir' ? 'Transferido p/ ' + esc(lojaN(os.lojaDestino)) : os.atendimento === 'terceiro' ? 'Terceirizado: ' + esc(fornN(os.fornecedorId)) : 'A definir'}</div><div><small>Técnico</small>${esc(userN(os.tecnicoId))}</div>
  ${os.previsao ? `<div><small>Previsão</small>${fd(os.previsao)}</div>` : ''}<div><small>Custo (peças + MO)</small>${brl(os.custoPecas)} + ${brl(os.custoMO)} = <b>${brl(custo(os))}</b></div>${os.nf ? `<div><small>NF / laudo</small>${esc(os.nf)}</div>` : ''}</div>

  <h3 style="font-size:14px">Linha do tempo e permanência por etapa</h3><ul class="tl" style="padding-left:14px">${timeline}</ul>`, 1);

  function tipoCfg2(n) { return T.find(t => t.nome === n) || { crit: 'baixa', freq: 180 }; }

/* hashes dos usuários demo (assíncrono) */
async function prepDemo() {
  if (CONFIG.API_URL) return;
  const d = Local.db(); let ch = false;
  for (const u of d.usuarios) if (String(u.hash).startsWith('PENDING:')) { const [, us, pw] = u.hash.split(':'); u.hash = await sha(us, pw); ch = true; }
  if (ch) Local.save(d);
}

})();
